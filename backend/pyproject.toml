[project]
name = "school-backend"
version = "0.1.0"
description = "校园百事通助手后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "cozepy",
    "python-multipart",
    "openai-whisper",
    "python-docx>=1.2.0",
    "pypdf>=6.21.1",
    "pywin32>=312",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "jieba>=0.42.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
